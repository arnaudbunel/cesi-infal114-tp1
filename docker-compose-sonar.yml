# Usage enseignant uniquement : permet de lancer un SonarQube Community
# local pour l'analyse du projet pendant le TP.
#
#   docker compose -f docker-compose-sonar.yml up -d
#
# SonarQube sera accessible sur http://localhost:9000
# (identifiants par defaut : admin / admin, a changer au premier login).
#
# Ce fichier n'est pas necessaire pour lancer ou tester l'application
# elle-meme.
services:
  sonarqube:
    image: sonarqube:community
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      - sonar-db

  sonar-db:
    image: postgres:16
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_db_data:
