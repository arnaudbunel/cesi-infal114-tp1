spring.application.name=boutique-api

# Base H2 en memoire - reinitialisee a chaque demarrage
spring.datasource.url=jdbc:h2:mem:boutiquedb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# Variables locales lues depuis .env (non commite, voir .env.example)
spring.config.import=optional:file:.env[.properties]

# Cle du programme fidelite : jamais en dur, fournie par l'environnement
loyalty.program.api-key=${LOYALTY_PROGRAM_API_KEY:}
