name: CI

# Pipeline minimal : compilation et execution des tests a chaque push
# et pull request sur main. Des etapes supplementaires (analyse
# statique, Quality Gate, publication de couverture...) pourront
# etre ajoutees par la suite.
on:
  push:
    branches:
      - groupe0
      - groupe1
      - groupe2
      - groupe3
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v6.1.0

      - name: Installation de Java 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilation et tests
        run: mvn --batch-mode test
